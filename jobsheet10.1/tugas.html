<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Bootstrap Sederhana</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- jQuery, Popper.js, Bootstrap JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-md bg-dark navbar-dark">
    <a class="navbar-brand" href="#">MyWebsite</a>

    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#menu">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Profil</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Kontak</a></li>
        </ul>
    </div>
</nav>

<!-- JUMBOTRON -->
<div class="jumbotron text-center">
    <h1>Selamat Datang</h1>
    <p>Website statis menggunakan Bootstrap 4</p>
    <a href="#" class="btn btn-primary">Pelajari Lebih Lanjut</a>
</div>

<!-- CONTENT -->
<div class="container">
    <div class="row">

        <!-- GAMBAR -->
        <div class="col-md-6">
            <img src="https://via.placeholder.com/500"
                 class="img-fluid rounded"
                 alt="Gambar Bootstrap">
        </div>

        <!-- CARD (TAMBAHAN NILAI) -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Tentang Bootstrap</h5>
                    <p class="card-text">
                        Bootstrap adalah framework CSS yang digunakan untuk membuat website
                        responsif dan modern dengan cepat.
                    </p>
                    <button class="btn btn-success">Baca Selengkapnya</button>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- FOOTER (TAMBAHAN NILAI) -->
<footer class="bg-dark text-white text-center mt-4 p-3">
    © 2025 | Nama Mahasiswa – NIM
</footer>

</body>
</html>
